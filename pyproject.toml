[project]
name = "rt-second"
version = "0.1.0"
description = "Code search app with optional GPU and reranker flags"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "pathlib>=1.0.1",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=2.2.2",
    "streamlit>=1.45.0",
    "ollama>=0.1.0",
    "torchvision>=0.27.0",
    "psutil>=7.2.2",
    "googletrans>=4.0.2",
    "deep-translator>=1.11.4",
]
