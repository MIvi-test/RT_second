services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TORCH_VARIANT: cpu
    container_name: code-search
    ports:
      - "8501:8501"
    volumes:
      - ${STORAGE:-./storage}:/storage
      - ${HF_HOME:-hf_cache}:/root/.cache/huggingface
      - ${SOURCE:-./dataset_case3_v1.0_fix}:/app/dataset_case3_v1.0_fix
    environment:
      - PYTHONUNBUFFERED=1
      - USE_RERANKER=false
      - USE_GPU=false
      - USE_OLLAMA=false
      - STORAGE_DIR=/app/storage
      - SOURCE_PATH=/app/dataset_case3_v1.0_fix/
