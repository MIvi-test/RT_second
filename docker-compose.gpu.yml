# GPU override: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  app:
    build:
      args:
        TORCH_VARIANT: cuda
    environment:
      - USE_GPU=true
      - OLLAMA_HOST=http://ollama:11434
      - LLM_MODEL=llama3.1:8b
      - PYTHONUNBUFFERED=1
      - USE_RERANKER=false
      - USE_OLLAMA=true
      - STORAGE_DIR=/storage
      - SOURCE_PATH=/app/dataset_case3_v1.0_fix/gymhero
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]