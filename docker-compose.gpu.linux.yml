# GPU override: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
networks:
  internal:
    driver: bridge

volumes:
  storage_data:
    driver: local
  hf_cache:
    driver: local

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama                                
    ports:
      - "11434:11434"
    volumes:
      - ${OLLAMA_HOME:-~/.ollama}:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    networks:
      - internal
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TORCH_VARIANT: cuda
    container_name: code-search
    ports:
      - "8501:8501"
    volumes:
      - ${BD_PATH:-./storage}:/storage
      - ${HF_HOME:-hf_cache}:/root/.cache/huggingface
      - ${SOURCE:-./dataset_case3_v1.0_fix}:/app/dataset_case3_v1.0_fix
      - ${SCORE_PATH:-./dataset_case3_v1.0_fix/score.py}:/app/score.py
      - ${EVAL_PATH:-./dataset_case3_v1.0_fix/eval_questions.json}:/app/eval_questions.json
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - LLM_MODEL=llama3.2:3b
      - USE_RERANKER=false
      - USE_GPU=true
      - USE_OLLAMA=true
      - STORAGE_DIR=/storage
      - SOURCE_PATH=/app/dataset_case3_v1.0_fix/
      - HF_TOKEN=${HF_TOKEN}
      - HF_HOME=/root/.cache/huggingface
      - LOG_LEVEL=info
      - SCORE_PATH=/app/score.py
      - EVAL_PATH=/app/eval_questions.json
    depends_on:
      - ollama
    networks:
      - internal
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    