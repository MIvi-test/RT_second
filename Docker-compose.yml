version: '3.8'

networks:
  search_network:
    driver: bridge

volumes:
  ollama_data:
    driver: local
  shared_storage:
    driver: local
  huggingface_cache:
    driver: local

services:
  # ── Ollama сервис (запускает LLM) ──────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - search_network
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G

  # ── Инициализация индексов (однократный запуск) ───────────────────────────
  init-index:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: code-index-builder
    volumes:
      # Монтируем директорию с исходными данными (репозиторий для индексации)
      - ./dataset_case3_v1.0_fix:/app/dataset_case3_v1.0_fix:ro
      # Общее хранилище для chroma_db и bm25 файлов (чтение+запись на старте)
      - shared_storage:/app/storage
      # Кеш HuggingFace моделей (эмбеддер, кросс-энкодер)
      - huggingface_cache:/app/cache/huggingface
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - HF_HOME=/app/cache/huggingface
      - PYTHONUNBUFFERED=1
    working_dir: /app
    command: >
      sh -c "
        echo '=== Starting index building ===' &&
        # Копируем/линкуем данные из монтированной директории в ожидаемое место
        # (индексный скрипт ожидает dataset_case3_v1.0_fix в текущей папке)
        # В нашем случае директория уже смонтирована в /app/dataset_case3_v1.0_fix,
        # что соответствует ожиданиям скрипта (SCRIPT_DIR/../dataset_case3_v1.0_fix)
        python index.py &&
        # После успешного построения копируем результаты в shared_storage
        cp -r chroma_db /app/storage/ &&
        cp bm25_index.pkl bm25_meta.json results.json /app/storage/ &&
        echo '=== Index building finished ==='
      "
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - search_network
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 4G

  # ── Загрузка весов mistral:7b (после индексации) ──────────────────────────
  pull-model:
    image: ollama/ollama:latest
    container_name: ollama-pull
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama
    entrypoint:
      - sh
      - -c
      - |
        echo '=== [Stage 3] Waiting for Ollama API to be ready ==='
        # Ждём, пока API начнёт отвечать (используем ollama list)
        until ollama list > /dev/null 2>&1; do
          echo '  ... Ollama not ready yet, retrying in 3s'
          sleep 3
        done
        echo '=== Checking if model already exists ==='
        if ollama list | grep -q 'mistral:7b'; then
          echo '=== Model mistral:7b already present, skipping pull ==='
        else
          echo '=== Pulling mistral:7b (this may take several minutes) ==='
          ollama pull mistral:7b
        fi
        echo '=== Warm-up: load model into memory ==='
        # Отправляем минимальный запрос, чтобы модель загрузилась в RAM/VRAM
        curl -s -X POST http://ollama:11434/api/generate -d '{"model":"mistral:7b","stream":false,"prompt":"Hello"}' > /dev/null || true
        echo '=== Stage 3 completed ==='
    restart: "no"
    depends_on:
      init-index:
        condition: service_completed_successfully
    networks:
      - search_network

  # ── Streamlit UI (запускается после загрузки модели) ──────────────────────
  streamlit-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: streamlit-search
    ports:
      - "8501:8501"
    volumes:
      # Общее хранилище: chroma_db, bm25 файлы (только чтение для UI)
      - shared_storage:/app/storage:ro
      # Кеш HuggingFace моделей (только чтение)
      - huggingface_cache:/app/cache/huggingface:ro
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - HF_HOME=/app/cache/huggingface
      - STORAGE_DIR=/app/storage
      - PYTHONUNBUFFERED=1
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    command: >
      streamlit run app.py
      --server.port=8501
      --server.address=0.0.0.0
      --server.headless=true
      --server.fileWatcherType=none
    restart: unless-stopped
    depends_on:
      pull-model:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - search_network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ── Опциональный сервис для выполнения предопределённых запросов ──────────
  query-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: query-runner
    volumes:
      - shared_storage:/app/storage:ro
      - huggingface_cache:/app/cache/huggingface:ro
      - ./dataset_case3_v1.0_fix:/app/dataset_case3_v1.0_fix:ro
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - HF_HOME=/app/cache/huggingface
      - PYTHONUNBUFFERED=1
    working_dir: /app
    command: python query.py
    depends_on:
      pull-model:
        condition: service_completed_successfully
    networks:
      - search_network
    restart: "no"
    profiles:
      - tools   # Запускать только при явном указании: docker-compose --profile tools up query-runner