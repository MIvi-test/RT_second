# GPU override: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
# (or standalone: docker compose -f docker-compose.gpu.yml up --build)

networks:
  internal:
    driver: bridge

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TORCH_VARIANT: cuda
    container_name: code-search
    ports:
      - "8501:8501"
    volumes:
      - ${BD_PATH:-./storage}:/storage
      - ${HF_HOME:-${USERPROFILE}/.cache/huggingface}:/root/.cache/huggingface
      - ${SOURCE:-${USERPROFILE}/Downloads/dataset}:/app/dataset_case3_v1.0_fix
      - ${SCORE_PATH:-./dataset_case3_v1.0_fix/score.py}:/app/score.py
      - ${EVAL_PATH:-./dataset_case3_v1.0_fix/eval_questions.json}:/app/eval_questions.json
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - LLM_MODEL=llama3.2:3b
      - USE_RERANKER=false
      - USE_GPU=true
      - USE_OLLAMA=true
      - STORAGE_DIR=/storage
      - SOURCE_PATH=/app/dataset_case3_v1.0_fix/
      - HF_TOKEN=${HF_TOKEN}
      -
    extra_hosts:
      host.docker.internal: host-gateway
    networks:
      - internal
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
